server:
  port: 12231
  # 只监听本机回环地址：本机工具默认不对局域网开放，避免无鉴权暴露
  address: 127.0.0.1

spring:
  application:
    name: intern-helper
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/intern_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 账号密码走环境变量，不要把真实密码提交到仓库
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  jackson:
    # 保留 null 字段：前端靠字段判断「未解析」，缺字段会报错
    default-property-inclusion: always

# 候选人信息：本地运行时用环境变量覆盖，仓库里只放占位值
app:
  candidate:
    school: ${CANDIDATE_SCHOOL:某大学}
    grade: ${CANDIDATE_GRADE:2028届}
  # 岗位投放目录：抓取脚本把 json 丢进来，系统每 5 分钟自动导入并移到 imported/
  import-dir: ${IMPORT_DIR:import-drop}
  import-scan-ms: 300000
  # 网页端「按网址自动取数」调用的 Node 可执行文件；留空则自动探测
  node-path: ${NODE_EXE:}

# 话术生成：默认模板生成；配置 GREETING_ENGINE=AI 或 HYBRID 后启用模型润色
greeting:
  engine: ${GREETING_ENGINE:RULE}
  prompt-version: v1

# 额度：首期按本机实例计量，固定 userKey=local
billing:
  default-budget-cny: ${BILLING_DEFAULT_BUDGET_CNY:0.1}
  mode: ${BILLING_MODE:PLATFORM}

# 模型接口：密钥与单价走环境变量，不提交真实值
ai:
  base-url: ${DEEPSEEK_BASE_URL:}
  model: ${DEEPSEEK_MODEL:}
  platform-api-key: ${PLATFORM_DEEPSEEK_API_KEY:}
  byo-api-key: ${DEEPSEEK_API_KEY:}
  # 单价单位：元 / 1M tokens。输入价分缓存命中 / 未命中两档
  price-input-per-1m: ${DEEPSEEK_PRICE_INPUT_PER_1M:0}
  price-input-cache-hit-per-1m: ${DEEPSEEK_PRICE_INPUT_CACHE_HIT_PER_1M:0}
  price-input-cache-miss-per-1m: ${DEEPSEEK_PRICE_INPUT_CACHE_MISS_PER_1M:0}
  price-output-per-1m: ${DEEPSEEK_PRICE_OUTPUT_PER_1M:0}

  # 兼容旧单位 元 / 1K tokens；仅当对应 1M 单价未配置时生效
  price-input-per-1k: ${DEEPSEEK_PRICE_INPUT_PER_1K:0}
  price-input-cache-hit-per-1k: ${DEEPSEEK_PRICE_INPUT_CACHE_HIT_PER_1K:0}
  price-input-cache-miss-per-1k: ${DEEPSEEK_PRICE_INPUT_CACHE_MISS_PER_1K:0}
  price-output-per-1k: ${DEEPSEEK_PRICE_OUTPUT_PER_1K:0}
  max-tokens: ${AI_MAX_TOKENS:300}
  timeout-ms: ${AI_TIMEOUT_MS:8000}

logging:
  level:
    root: info
    com.zhou.internhelper: debug
