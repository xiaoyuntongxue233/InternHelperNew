<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>实习投递助手</title>
  <script src="/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #222; }
    header { background: #1f6f63; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #d8f0ea; font-size: 13px; text-decoration: none; border: 1px solid #4e8f85; padding: 5px 10px; border-radius: 6px; }
    header a:hover { background: #2b8073; }
    .stats { display: flex; gap: 20px; font-size: 13px; opacity: .95; flex-wrap: wrap; align-items: center; }
    .stats b { font-size: 17px; }
    .sync { margin-left: auto; font-size: 12px; opacity: .9; }
    main { padding: 18px 24px 60px; max-width: 1360px; margin: 0 auto; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    input, select, button { font-size: 14px; padding: 7px 10px; border: 1px solid #cfd6dd; border-radius: 6px; background: #fff; }
    button { cursor: pointer; }
    button.primary { background: #1f6f63; color: #fff; border-color: #1f6f63; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    /* 固定布局：列宽由表头决定，刷新/回填长文本时不会被内容撑宽 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 8px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #eef1f4; vertical-align: top; overflow-wrap: anywhere; }
    th { overflow: hidden; text-overflow: ellipsis; }
    td:last-child, th:last-child { white-space: normal; }
    th { background: #f0f4f6; font-weight: 600; position: relative; }
    .col-resizer { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 3; }
    .col-resizer:hover { background: rgba(31,111,99,.25); }
    tbody { position: relative; }
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable:hover { background: #e6edf0; }
    th .arrow { color: #1f6f63; font-size: 11px; margin-left: 2px; }
    tr:hover td { background: #fafcfd; }
    .greet { margin-top: 2px; padding: 2px 10px; background: #f6fbf9; border: 1px dashed #a9cfc6; border-radius: 6px; font-size: 13px; line-height: 1.18; white-space: pre-wrap; width: 100%; max-width: 100%; }
    .greet button { padding: 1px 6px; font-size: 11px; }
    .greet .muted { font-size: 11px; }
    .clause-alert { background: #fff4e5; color: #8a5a00; border: 1px solid #f0d8a8; border-radius: 6px; padding: 5px 8px; font-size: 12px; margin: 2px 0; line-height: 1.4; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e8f3f0; color: #1f6f63; }
    .muted { color: #889; font-size: 12px; }
    .pager { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .pager .info { margin-left: auto; color: #667; font-size: 13px; }
    .pager input { width: 70px; }
    .drawer-mask { position: fixed; inset: 0; background: rgba(20,30,30,.4); display: none; justify-content: flex-end; z-index: 40; }
    .drawer { background: #fff; width: min(560px, 100%); height: 100%; overflow: auto; padding: 20px 22px; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-head h3 { margin: 0; font-size: 16px; color: #1f6f63; }
    .drawer-head button { font-size: 22px; line-height: 1; padding: 2px 10px; }
    .drawer-note { font-size: 12px; color: #889; margin: 10px 0 14px; line-height: 1.6; }
    .rec { border-bottom: 1px solid #eef1f4; padding: 10px 0; }
    .rec .meta { font-size: 12px; color: #889; }
    .rec .msg { font-size: 13px; margin-top: 4px; white-space: pre-wrap; }
    .rec button { margin-top: 6px; font-size: 12px; padding: 3px 8px; color: #c0392b; }
    .status-tag { white-space: nowrap; }

    /* ===== P0 体验增强 ===== */
    .toast { position: fixed; right: 20px; bottom: 20px; background: #1f6f63; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; border-left: 4px solid transparent; }
    .toast.show { opacity: 1; }
    .toast.err { background: #a93226; border-left-color: #f5c4b3; }
    .confirm-mask { position: fixed; inset: 0; background: rgba(20,30,30,.45); display: none; align-items: center; justify-content: center; z-index: 55; padding: 20px; }
    .confirm-box { background: #fff; border-radius: 10px; max-width: 400px; width: 100%; padding: 20px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
    .confirm-box h3 { margin: 0 0 10px; font-size: 15px; color: #1f6f63; }
    .confirm-box p { margin: 0; font-size: 13px; color: #445; line-height: 1.6; word-break: break-word; }
    .confirm-box .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .confirm-box .danger { background: #c0392b; color: #fff; border-color: #c0392b; }
    .batch-bar { display: none; gap: 8px; align-items: center; flex-wrap: wrap; background: #eef7f4; border: 1px solid #cfe6df; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .batch-bar.show { display: flex; }
    .batch-bar b { font-size: 13px; color: #1f6f63; }
    .batch-bar select { padding: 4px 8px; font-size: 13px; }
    th.col-sel, td.col-sel { width: 34px; text-align: center; }
    .status-sel { padding: 3px 6px; font-size: 12px; max-width: 104px; }
    tr.focused td { background: #eef7f4 !important; box-shadow: inset 3px 0 0 #1f6f63; }
    .greet-edit { width: 100%; min-height: 42px; font-size: 13px; line-height: 1.5; padding: 6px 8px; border: 1px solid #cfd6dd; border-radius: 6px; resize: vertical; font-family: inherit; white-space: pre-wrap; }
    .hist-list { margin-top: 6px; max-height: 200px; overflow: auto; border-top: 1px dashed #cfe6df; padding-top: 6px; }
    .hist-item { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 4px 2px; border-bottom: 1px solid #eef1f4; }
    .hist-item .hmeta { color: #889; flex: 1; }
    .hist-item .htext { color: #445; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kbd-hint { font-size: 11px; color: #889; }
    .shortcut-panel { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: #556; background: #f7f9fa; border: 1px solid #e4e9ec; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
    .shortcut-panel b { color: #334; }
    .shortcut-panel kbd { display: inline-block; min-width: 16px; text-align: center; padding: 1px 5px; font-size: 11px; font-family: inherit; color: #2c6; background: #fff; border: 1px solid #ccd4d8; border-bottom-width: 2px; border-radius: 4px; }

    /* ===== 移动端适配：窄屏表格转卡片 ===== */
    @media (max-width: 768px) {
      header { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
      header h1 { font-size: 18px; flex-basis: 100%; }
      header a { font-size: 12px; padding: 4px 8px; }
      .stats { gap: 8px 14px; flex-basis: 100%; font-size: 12px; }
      .stats b { font-size: 14px; }
      .sync { margin-left: 0; flex-basis: 100%; word-break: break-all; white-space: normal; }
      main { padding: 12px 14px 50px; }
      .toolbar { gap: 6px; }
      .toolbar select, .toolbar input { flex: 1 1 45%; min-width: 0; }

      table, thead, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody { display: block; }
      tbody > tr:not(.greet-row) {
        background: #fff; border: 1px solid #e6ecef; border-radius: 8px;
        margin-bottom: 10px; padding: 10px 12px;
      }
      tbody > tr:not(.greet-row) td {
        border: none; padding: 4px 0; text-align: left; white-space: normal;
        display: flex; gap: 10px; align-items: flex-start;
      }
      tbody > tr:not(.greet-row) td::before {
        content: attr(data-label); flex: 0 0 72px; color: #889; font-size: 12px; font-weight: 600;
      }
      tbody > tr:not(.greet-row) td[data-label="岗位"] { font-size: 14px; font-weight: 600; }
      tbody > tr:not(.greet-row) td:last-child { flex-wrap: wrap; gap: 6px; }
      tbody > tr:not(.greet-row) td:last-child::before { flex-basis: 100%; }
      .greet-row td { padding: 0 !important; }
      .greet { max-width: 100%; line-height: 1.5; }
      .pager { gap: 6px; }
      .pager .info { margin-left: 0; flex-basis: 100%; }
    }
  </style>
  <link rel="stylesheet" href="/theme.css"/>
</head>
<body>
<header>
  <h1>实习投递助手</h1>
  <a href="/form.html">+ 添加岗位</a>
  <a href="/profile.html">个人资料</a>
  <a href="javascript:void(0)" onclick="openRecords()">投递记录</a>
  <a href="/settings.html">设置</a>
  <div class="stats" id="stats">加载中…</div>
</header>

<main>
  <div class="toolbar">
    <select id="province"><option value="">全部省份</option></select>
    <select id="city"><option value="">全部城市</option></select>
    <select id="district"><option value="">全部区县</option></select>
    <select id="category">
      <option value="INTERN">仅实习岗</option>
      <option value="">全部类型</option>
      <option value="FULLTIME">仅社招岗</option>
    </select>
    <select id="status">
      <option value="">全部状态</option>
      <option value="NEW">未投递</option>
      <option value="CONTACTED">已投递</option>
      <option value="SKIPPED">已跳过</option>
    </select>
    <input id="q" placeholder="搜索公司 / 岗位" style="width:190px" />
    <button class="primary" onclick="applyFilter()">查询</button>
    <button onclick="resetAll()">重置</button>
    <button onclick="resetTableLayout()" title="恢复默认列宽与行高">表格布局重置</button>
    <span class="muted" id="total"></span>
    <span class="kbd-hint" id="kbdHint">快捷键：j/k 移动 · g 生成 · c 复制 · s 已投递 · x 勾选 · / 搜索</span>
  </div>

  <div class="batch-bar" id="batchBar">
    <b id="batchCount">已选 0 条</b>
    <button onclick="batchGenerate()">批量生成话术</button>
    <button onclick="batchContacted()">批量设为已投递</button>
    <select id="batchStatusSel">
      <option value="NEW">设为未投递</option>
      <option value="CONTACTED">设为已投递</option>
      <option value="SKIPPED">设为已跳过</option>
    </select>
    <button onclick="batchChangeStatus()">应用状态</button>
    <button class="danger" onclick="batchDelete()">批量删除</button>
    <button onclick="clearSelection()">取消选择</button>
    <button onclick="toggleShortcuts()" title="键盘快捷键">⌨ 快捷键</button>
    <span class="muted" id="batchMsg"></span>
  </div>
  <div class="shortcut-panel" id="shortcutPanel" style="display:none">
    <b>键盘快捷键</b>（焦点不在输入框时生效）：
    <span><kbd>j</kbd>/<kbd>k</kbd> 上/下移行</span>
    <span><kbd>g</kbd> 生成话术</span>
    <span><kbd>c</kbd> 复制话术</span>
    <span><kbd>s</kbd> 设为已投递</span>
    <span><kbd>x</kbd> 勾选/取消当前行</span>
    <span><kbd>/</kbd> 聚焦搜索框</span>
    <span><kbd>Esc</kbd> 关闭确认框</span>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
    <tr>
      <th class="col-sel"><input type="checkbox" id="selAll" onchange="toggleSelectAll(this.checked)" title="全选本页"/></th>
      <th>公司</th>
      <th>岗位</th>
      <th>地点</th>
      <th class="sortable" onclick="toggleSort('months')">实习(月)<span class="arrow" id="ar-months"></span></th>
      <th class="sortable" onclick="toggleSort('days')">出勤(天/周)<span class="arrow" id="ar-days"></span></th>
      <th class="sortable" onclick="toggleSort('dailyMin')">最低日薪(元)<span class="arrow" id="ar-dailyMin"></span></th>
      <th class="sortable" onclick="toggleSort('dailyMax')">最高日薪(元)<span class="arrow" id="ar-dailyMax"></span></th>
      <th>薪资原文</th>
      <th class="sortable" onclick="toggleSort('status')">状态<span class="arrow" id="ar-status"></span></th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  </div>

  <div class="pager">
    <button id="btnPrev" onclick="prevPage()">上一页</button>
    <button id="btnNext" onclick="nextPage()">下一页</button>
    <button onclick="firstPage()">回到第一页</button>
    <select id="size" onchange="applyFilter()">
      <option value="15">每页 15 条</option>
      <option value="30">每页 30 条</option>
      <option value="50">每页 50 条</option>
    </select>
    <span>跳转到</span>
    <input id="jumpPage" type="number" min="1" placeholder="页码" />
    <span>页</span>
    <button onclick="jumpPage()">跳转</button>
    <span class="info" id="pageInfo"></span>
  </div>
</main>

<!-- 投递记录抽屉：复用 /api/stats/recent，支持删除测试残留 -->
<div class="drawer-mask" id="recordsMask">
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
    <div class="drawer-head">
      <h3 id="recordsTitle">投递记录（最近 50 条）</h3>
      <button onclick="closeRecords()" aria-label="关闭">×</button>
    </div>
    <div class="drawer-note">删除岗位不影响历史投递记录；成功率按当日记录计算。AI 额度账本不可删除。</div>
    <div id="recordsBox" style="font-size:13px;color:#667">加载中…</div>
  </div>
</div>

<!-- 轻量 toast 与通用确认框 -->
<div class="toast" id="toast"></div>
<div class="confirm-mask" id="confirmMask">
  <div class="confirm-box" role="dialog" aria-modal="true">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMessage"></p>
    <div class="btns">
      <button id="confirmCancel">取消</button>
      <button class="danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<script>
  // cursor 模式：顺序翻页，深翻页恒定耗时；offset 模式：跳页 / 排序
  let cursor = null;
  let nextCursor = null;
  let stack = [];
  let pageNo = 1;
  let totalPages = 1;
  // 默认不排序 → 走游标模式（顺序翻页、深翻页恒定耗时）；点表头排序才切到 offset 模式
  let sortField = null;
  let sortOrder = 'desc';

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) {
      // 优先显示后端 message（全局异常处理器返回 {code,message}），否则退回状态码
      let msg = '请求失败 ' + res.status;
      try {
        const d = await res.json();
        if (d && d.message) msg = d.message;
      } catch (_) { /* 非 JSON 响应（如 405 的空响应）保留状态码文案 */ }
      throw new Error(msg);
    }
    return res.json();
  }

  async function initRegions() {
    const tree = await api('/api/jobs/regions/tree');
    const p = document.getElementById('province');
    tree.forEach(node => {
      const opt = document.createElement('option');
      opt.value = node.province;
      opt.textContent = node.province;
      opt.dataset.cities = JSON.stringify(node.cities);
      p.appendChild(opt);
    });
    p.onchange = () => { fillCities(); load(true); };
    document.getElementById('city').onchange = () => { fillDistricts(); load(true); };
    document.getElementById('district').onchange = () => load(true);
    document.getElementById('jumpPage').addEventListener('keydown', e => { if (e.key === 'Enter') jumpPage(); });
  }

  function fillCities() {
    const p = document.getElementById('province');
    const citySel = document.getElementById('city');
    citySel.innerHTML = '<option value="">全部城市</option>';
    const opt = p.options[p.selectedIndex];
    if (!opt || !opt.dataset.cities) return;
    JSON.parse(opt.dataset.cities).forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      citySel.appendChild(o);
    });
  }

  async function fillDistricts() {
    const province = document.getElementById('province').value;
    const city = document.getElementById('city').value;
    const dSel = document.getElementById('district');
    dSel.innerHTML = '<option value="">全部区县</option>';
    if (!province || !city) return;
    const list = await api(`/api/jobs/regions/districts?province=${encodeURIComponent(province)}&city=${encodeURIComponent(city)}`);
    list.forEach(d => {
      const o = document.createElement('option');
      o.value = d; o.textContent = d;
      dSel.appendChild(o);
    });
  }

  function buildParams() {
    const params = new URLSearchParams();
    params.set('size', document.getElementById('size').value);
    const map = { province: 'province', city: 'city', district: 'district', status: 'status', q: 'q', category: 'category' };
    Object.entries(map).forEach(([id, key]) => {
      const v = document.getElementById(id).value.trim();
      if (v) params.set(key, v);
    });
    if (sortField) {
      params.set('sort', sortField);
      params.set('order', sortOrder);
    }
    return params;
  }

  // reset=true 回到第一页；reset=false 顺序翻页（cursor）
  async function load(reset, useOffset) {
    if (reset) { cursor = null; nextCursor = null; stack = []; pageNo = 1; }
    const params = buildParams();
    if (useOffset || sortField) {
      params.set('page', pageNo);
    } else if (cursor != null) {
      params.set('cursor', cursor);
    }

    const data = await api('/api/jobs?' + params);
    if (data.mode === 'offset') {
      totalPages = data.totalPages || 1;
      pageNo = data.page || pageNo;
    } else {
      nextCursor = data.nextCursor;
      totalPages = Math.max(1, Math.ceil(data.total / data.size));
    }

    document.getElementById('total').textContent = `符合条件的岗位：${data.total} 个`;
    document.getElementById('pageInfo').textContent =
      `共 ${data.total} 个岗位 · 第 ${pageNo} / ${totalPages} 页 · 每页 ${data.size} 条`;
    document.getElementById('btnPrev').disabled = pageNo <= 1;
    document.getElementById('btnNext').disabled = pageNo >= totalPages;
    document.getElementById('jumpPage').max = String(totalPages);
    updateArrows();

    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    data.items.forEach(job => {
      const loc = [job.province, job.city, job.district].filter(Boolean).join(' / ') || job.rawLocation || '';
      const tr = document.createElement('tr');
      const st = job.status === 'CONTACTED'
        ? { label: '已投递', bg: '#e6f0ff' }
        : job.status === 'SKIPPED'
          ? { label: '已跳过', bg: '#eef1f4' }
          : { label: '未投递', bg: '#e8f3f0' };
      tr.dataset.jobId = job.id;
      tr.innerHTML = `
        <td class="col-sel"><input type="checkbox" class="job-sel" data-id="${job.id}" onchange="syncSelection()"/></td>
        <td data-label="公司">${esc(job.company)}</td>
        <td data-label="岗位">${esc(job.title)}${job.category === 'FULLTIME' ? ' <span class="tag" style="background:#fdeeee;color:#b33">社招</span>' : ''}<div class="muted">${esc(job.skills || '')}</div></td>
        <td data-label="地点">${esc(loc)}</td>
        <td data-label="实习月数">${job.months ? job.months : '<span class="muted">-</span>'}</td>
        <td data-label="出勤天数">${job.days ? job.days : '<span class="muted">-</span>'}</td>
        <td data-label="最低日薪">${job.dailyMin ? job.dailyMin : '<span class="muted">-</span>'}</td>
        <td data-label="最高日薪">${job.dailyMax ? job.dailyMax : '<span class="muted">-</span>'}</td>
        <td class="muted" data-label="薪资原文">${esc(job.salary || '-')}</td>
        <td data-label="状态"><span class="tag status-tag" style="background:${st.bg}">${st.label}</span></td>
        <td data-label="操作">
          <button onclick="gen(${job.id})">生成话术</button>
          <select class="status-sel" data-id="${job.id}" data-prev="${job.status || 'NEW'}" onchange="changeStatus(${job.id}, this.value)" title="更改投递状态">
            <option value="NEW" ${job.status !== 'CONTACTED' && job.status !== 'SKIPPED' ? 'selected' : ''}>未投递</option>
            <option value="CONTACTED" ${job.status === 'CONTACTED' ? 'selected' : ''}>已投递</option>
            <option value="SKIPPED" ${job.status === 'SKIPPED' ? 'selected' : ''}>已跳过</option>
          </select>
          <button onclick="location.href='/form.html?id=${job.id}'">编辑</button>
          <button class="btn-del" data-id="${job.id}" data-company="${esc(job.company)}" data-title="${esc(job.title)}" style="color:#c0392b;border-color:#e0b4ae">删除</button>
          ${safeUrl(job.url) ? `<a href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener noreferrer" style="font-size:12px;margin-left:6px">打开</a>` : ''}
        </td>`;
      rows.appendChild(tr);

      // 话术面板单独占一行（colspan 全表宽），避免挤在窄列里变成细长条
      const trG = document.createElement('tr');
      trG.id = 'gr-' + job.id;
      trG.style.display = 'none';
      trG.className = 'greet-row';
      trG.innerHTML = `<td colspan="11" style="padding:0 12px 3px 12px"><div class="greet" id="g-${job.id}"></div></td>`;
      rows.appendChild(trG);
    });
    // 翻页/筛选后 DOM 重建，复选框选择随行销毁；同步批量栏计数与实际选中，避免提示误导
    syncSelection();
    applyRowHeights();
    refreshStats();
  }

  function applyFilter() { load(true); }

  function prevPage() {
    if (pageNo <= 1) return;
    if (sortField) { pageNo--; load(false, true); return; }
    if (!stack.length) return;
    cursor = stack.pop();
    pageNo--;
    load(false);
  }

  function nextPage() {
    if (pageNo >= totalPages) return;
    if (sortField) { pageNo++; load(false, true); return; }
    if (nextCursor == null) return;
    stack.push(cursor);
    cursor = nextCursor;
    pageNo++;
    load(false);
  }

  function firstPage() { load(true); }

  function jumpPage() {
    const input = document.getElementById('jumpPage');
    let target = parseInt(input.value, 10);
    if (isNaN(target) || target < 1) { toast('请输入正确的页码', 'err'); return; }
    if (target > totalPages) { toast('超出范围，共 ' + totalPages + ' 页', 'err'); return; }
    pageNo = target;
    load(false, true);
    input.value = '';
  }

  function toggleSort(field) {
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }
    pageNo = 1;
    load(true, true);
  }

  function updateArrows() {
    ['months', 'days', 'dailyMin', 'dailyMax', 'status'].forEach(f => {
      const el = document.getElementById('ar-' + f);
      if (!el) return;
      el.textContent = sortField === f ? (sortOrder === 'asc' ? '▲' : '▼') : '';
    });
  }

  function resetAll() {
    document.getElementById('province').value = '';
    fillCities();
    document.getElementById('district').innerHTML = '<option value="">全部区县</option>';
    document.getElementById('status').value = '';
    document.getElementById('category').value = 'INTERN';
    document.getElementById('q').value = '';
    sortField = null;
    sortOrder = 'desc';
    load(true);
  }

  function renderGreet(id, g) {
    const box = document.getElementById('g-' + id);
    if (!box) return;
    box.dataset.loaded = '1';
    // 只把话术正文作为可复制内容；核对提示不进入 dataset.message，复制不会带上免责声明
    box.dataset.message = g.message || '';
    const allWarnings = g.warnings || [];
    const isCheckHint = w => w.includes('请核对') || w.includes('技能句来自');
    const alerts = allWarnings.filter(isCheckHint);
    const others = allWarnings.filter(w => !isCheckHint(w));
    // 事实核对提示前置为醒目黄条，正文下方只保留其余普通提示
    const alertHtml = alerts.length
      ? `<div class="clause-alert">⚠ ${alerts.map(esc).join(' ')}</div>`
      : '';
    const otherHtml = others.map(w => `<div class="muted">${esc(w)}</div>`).join('');
    box.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="tag">${esc(g.direction)}</span>
        <span class="muted">${g.months}个月 / 每周${g.days}天 / ${g.length}字</span>
        <span class="muted">引擎：${esc(g.engine || 'RULE')}${g.templateId ? ' · 模板：' + esc(g.templateId) : ''}</span>
      </div>
      ${alertHtml}
      <textarea class="greet-edit" id="msg-${id}" oninput="onGreetEdit(${id})" title="可直接编辑；标记已投时保存编辑后的文本">${esc(g.message)}</textarea>
      <div class="muted" style="margin-top:1px">建议：${esc(g.advice || '')}</div>
      ${otherHtml}
      <div style="margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap">
        <button onclick="copyGreet(${id})">复制</button>
        <button onclick="saveGreet(${id})">保存编辑</button>
        <button onclick="toggleHistory(${id})">历史</button>
        <button onclick="collapseGreet(${id})">收起</button>
        <button id="regen-${id}" onclick="regenGreet(${id})">重新生成</button>
      </div>
      <div class="hist-list" id="hist-${id}" style="display:none"></div>`;
  }

  // 编辑时同步 dataset.message，使「标记已投」保存编辑后的文本；事实字段（月数/天数/方向）不受影响
  function onGreetEdit(id) {
    const box = document.getElementById('g-' + id);
    const ta = document.getElementById('msg-' + id);
    if (box && ta) box.dataset.message = ta.value;
  }

  async function saveGreet(id) {
    const ta = document.getElementById('msg-' + id);
    if (!ta) return;
    try {
      const d = await api('/api/jobs/' + id + '/greeting', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: ta.value })
      });
      toast('已保存为历史版本（' + d.length + ' 字）');
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  }

  async function toggleHistory(id) {
    const box = document.getElementById('hist-' + id);
    if (!box) return;
    if (box.style.display !== 'none') { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.textContent = '加载中…';
    try {
      const list = await api('/api/jobs/' + id + '/greetings');
      if (!list.length) { box.textContent = '暂无历史版本'; return; }
      box.innerHTML = list.map(v => `
        <div class="hist-item">
          <span class="hmeta">${esc(String(v.createdAt || '').replace('T', ' ').slice(0, 16))} · ${esc(v.source || v.engine || '-')} · ${(v.message || '').length}字</span>
          <span class="htext" title="${esc(v.message || '')}">${esc(v.message || '')}</span>
          <button class="use-ver" data-vtext="${esc(v.message || '')}">选用</button>
        </div>`).join('');
      // 在 box 上做一次事件委托：不依赖 onclick 字符串选择器与 DOM 层级，
      // 列表重渲染后重新绑定即可始终指向当前按钮。
      box.onclick = function (e) {
        const btn = e.target.closest('.use-ver');
        if (!btn) return;
        const ta = document.getElementById('msg-' + id);
        if (!ta) return;
        ta.value = btn.getAttribute('data-vtext') || '';
        onGreetEdit(id);
        toast('已选用该版本，可继续编辑');
      };
    } catch (e) { box.textContent = '读取失败：' + e.message; }
  }

  async function fetchGreet(id, force) {
    const wrap = document.getElementById('gr-' + id);
    const box = document.getElementById('g-' + id);
    if (!wrap || !box) return;
    if (!force && box.dataset.loaded === '1') {
      wrap.style.display = '';
      return;
    }
    const btn = document.getElementById('regen-' + id);
    if (force && btn) { btn.disabled = true; btn.textContent = '生成中…'; }
    try {
      const g = await api(`/api/jobs/${id}/greeting`);
      renderGreet(id, g);
      wrap.style.display = '';
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = '重新生成'; }
      toast('生成话术失败：' + e.message, 'err');
    }
  }

  async function gen(id) {
    const wrap = document.getElementById('gr-' + id);
    if (!wrap) return;
    // 已经展开 → 再点一次收起（不重复请求）
    if (wrap.style.display !== 'none') {
      wrap.style.display = 'none';
      return;
    }
    await fetchGreet(id, false);
  }

  async function regenGreet(id) {
    await fetchGreet(id, true);
  }

  function collapseGreet(id) {
    const wrap = document.getElementById('gr-' + id);
    if (wrap) wrap.style.display = 'none';
  }

  // 状态下拉变更：已投递走 contacted（附带话术写记录），未投递/已跳过只改状态不动投递记录
  async function changeStatus(id, status) {
    const sel = document.querySelector(`.status-sel[data-id="${id}"]`);
    const before = sel ? sel.dataset.prev : null;
    try {
      if (status === 'CONTACTED') {
        await contacted(id, false);
      } else {
        const res = await fetch(`/api/jobs/${id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.message || res.status);
        }
        toast('状态已更新');
        await load(false, !!sortField);
      }
      if (sel) sel.dataset.prev = status;
    } catch (e) {
      toast('状态更新失败：' + e.message, 'err');
      // 失败时把下拉还原到变更前的状态
      if (sel && before) sel.value = before;
      else await load(false, !!sortField);
    }
  }

  // 标记为已投递：只把用户已看到的话术存进记录，不在后端隐式生成
  async function contacted(id, notify = true) {
    const box = document.getElementById('g-' + id);
    const message = box ? (box.dataset.message || '') : '';
    const res = await fetch(`/api/jobs/${id}/contacted`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.message || res.status);
    }
    const r = await res.json();
    if (notify) { toast(r.reused ? '已更新今日投递记录' : '已记录投递'); await load(false, !!sortField); }
    return r;
  }

  async function removeJob(id, company, title) {
    const ok = await confirmBox('删除岗位', `确定删除「${company} / ${title}」吗？删除后不可恢复，但历史投递记录会保留。`);
    if (!ok) return;
    const res = await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
    if (res.ok) {
      toast('已删除');
      load(false, !!sortField);
    } else {
      const d = await res.json().catch(() => ({}));
      toast('删除失败：' + (d.message || res.status), 'err');
    }
  }

  // 删除按钮用事件委托：公司/岗位名只作为 data-* 文本读取，不进入脚本编译，
  // 彻底消除「JS 字符串嵌进 HTML 属性」的双重解析注入面（存储型 XSS）。
  document.getElementById('rows').addEventListener('click', function (e) {
    const btn = e.target.closest('.btn-del');
    if (!btn) return;
    removeJob(btn.dataset.id, btn.dataset.company, btn.dataset.title);
  });

  function copyGreet(id) {
    // 优先读编辑框当前值（用户可能已手动修改），与 dataset.message 保持同步
    const ta = document.getElementById('msg-' + id);
    const box = document.getElementById('g-' + id);
    const text = ta ? ta.value : (box ? (box.dataset.message || '') : '');
    copyText(text);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast('已复制到剪贴板');
    } catch (e) {
      // 非 HTTPS / 局域网场景 navigator.clipboard 不可用，回退到 execCommand
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { /* ignore */ }
      document.body.removeChild(ta);
      ok ? toast('已复制到剪贴板') : toast('复制失败，请手动选择文本', 'err');
    }
  }

  async function refreshStats() {
    const d = await api('/api/stats');
    const o = d.overview;
    document.getElementById('stats').innerHTML =
      `<span>今日已投 <b>${o.todaySuccess}</b> 家</span>
       <span title="按投递记录累计，不受岗位删除影响">累计成功 <b>${o.totalSuccess}</b></span>
       <span title="按当日投递记录计算">今日成功率 <b>${o.successRate}%</b></span>
       <span>岗位库 <b>${o.jobTotal}</b>（未投递 ${o.jobNew}）</span>
       <span class="sync" id="sync"></span>`;
    try {
      const last = await api('/api/import/latest');
      document.getElementById('sync').textContent = last.synced
        ? `最近同步：${(last.createdAt || '').replace('T', ' ').slice(0, 16)} · 新增 ${last.added} 条`
        : '尚未同步过';
    } catch (e) { /* ignore */ }
  }

  function safeUrl(s) {
    if (!s) return '';
    try {
      const u = new URL(s, location.href);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
    } catch (e) { return ''; }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== P0-1：toast 与通用确认框 =====
  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.className = 'toast show' + (type === 'err' ? ' err' : '');
    t.textContent = msg;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  let confirmResolve = null;
  function confirmBox(title, message) {
    return new Promise(resolve => {
      confirmResolve = resolve;
      // 用 textContent 写入，避免公司/岗位名进入 HTML 解析（延续 XSS 防护）
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmMask').style.display = 'flex';
    });
  }
  function closeConfirm(result) {
    document.getElementById('confirmMask').style.display = 'none';
    const r = confirmResolve;
    confirmResolve = null;
    if (r) r(result);
  }
  document.getElementById('confirmOk').addEventListener('click', () => closeConfirm(true));
  document.getElementById('confirmCancel').addEventListener('click', () => closeConfirm(false));
  document.getElementById('confirmMask').addEventListener('click', e => {
    if (e.target === document.getElementById('confirmMask')) closeConfirm(false);
  });

  // ===== P0-2：批量选择 =====
  function selectedIds() {
    return Array.from(document.querySelectorAll('.job-sel:checked')).map(c => Number(c.dataset.id));
  }
  function syncSelection() {
    const ids = selectedIds();
    document.getElementById('batchBar').classList.toggle('show', ids.length > 0);
    document.getElementById('batchCount').textContent = '已选 ' + ids.length + ' 条';
    const all = document.querySelectorAll('.job-sel');
    const selAll = document.getElementById('selAll');
    if (selAll) selAll.checked = all.length > 0 && ids.length === all.length;
  }
  function toggleSelectAll(checked) {
    document.querySelectorAll('.job-sel').forEach(c => { c.checked = checked; });
    syncSelection();
  }
  function clearSelection() {
    document.querySelectorAll('.job-sel').forEach(c => { c.checked = false; });
    const selAll = document.getElementById('selAll');
    if (selAll) selAll.checked = false;
    syncSelection();
  }

  function toggleShortcuts() {
    const p = document.getElementById('shortcutPanel');
    if (p) p.style.display = (p.style.display === 'none') ? 'flex' : 'none';
  }

  async function batchCall(url, body, okMsg) {
    try {
      const d = await api(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      toast(okMsg(d));
      clearSelection();
      await load(false, !!sortField);
      return d;
    } catch (e) { toast('批量操作失败：' + e.message, 'err'); return null; }
  }

  async function batchGenerate() {
    const ids = selectedIds();
    if (!ids.length) return;
    const ok = await confirmBox('批量生成话术', `将对选中的 ${ids.length} 条岗位生成话术。${ids.length > 10 ? 'AI 模式单次上限 10 条，RULE 模式 30 条；超限会被拒绝。' : 'AI 模式会消耗额度。'}`);
    if (!ok) return;
    const btnMsg = document.getElementById('batchMsg');
    btnMsg.textContent = '生成中…';
    const d = await batchCall('/api/jobs/batch/greeting', { ids }, r => {
      const okN = Object.keys(r.results || {}).length;
      const errN = Object.keys(r.errors || {}).length;
      return `生成完成：${okN} 条成功${errN ? '，' + errN + ' 条失败' : ''}`;
    });
    btnMsg.textContent = '';
    // 把生成结果渲染到对应面板
    if (d && d.results) {
      Object.entries(d.results).forEach(([id, g]) => {
        const wrap = document.getElementById('gr-' + id);
        if (wrap) wrap.style.display = '';
        renderGreet(id, g);
      });
    }
  }

  async function batchContacted() {
    const ids = selectedIds();
    if (!ids.length) return;
    const ok = await confirmBox('批量设为已投递', `将选中的 ${ids.length} 条岗位标记为已投递，并记录当前已生成的话术（未生成的不补生成）。`);
    if (!ok) return;
    const items = ids.map(id => {
      const box = document.getElementById('g-' + id);
      return { id: String(id), message: box ? (box.dataset.message || '') : '' };
    });
    await batchCall('/api/jobs/batch/contacted', items, r => `已记录 ${r.marked} 条投递`);
  }

  async function batchChangeStatus() {
    const ids = selectedIds();
    if (!ids.length) return;
    const status = document.getElementById('batchStatusSel').value;
    const label = status === 'NEW' ? '未投递' : status === 'CONTACTED' ? '已投递' : '已跳过';
    const ok = await confirmBox('批量改状态', `将选中的 ${ids.length} 条岗位设为「${label}」？已有投递记录不受影响。`);
    if (!ok) return;
    await batchCall('/api/jobs/batch/status', { ids, status }, r => `已更新 ${r.changed} 条状态`);
  }

  async function batchDelete() {
    const ids = selectedIds();
    if (!ids.length) return;
    const ok = await confirmBox('批量删除', `确定删除选中的 ${ids.length} 条岗位吗？此为软删除，历史投递记录保留。`);
    if (!ok) return;
    await batchCall('/api/jobs/batch/delete', { ids }, r => `已删除 ${r.deleted} 条岗位`);
  }

  // ===== P0-3：键盘快捷键 =====
  let focusId = null;
  function setFocus(id) {
    focusId = id;
    document.querySelectorAll('tr.focused').forEach(tr => tr.classList.remove('focused'));
    const tr = document.querySelector(`#rows tr[data-job-id="${id}"]`);
    if (tr) {
      tr.classList.add('focused');
      tr.scrollIntoView({ block: 'nearest' });
    }
  }
  function focusableIds() {
    return Array.from(document.querySelectorAll('.job-sel')).map(c => Number(c.dataset.id));
  }
  function moveFocus(delta) {
    const ids = focusableIds();
    if (!ids.length) return;
    const idx = ids.indexOf(focusId);
    const next = idx < 0 ? (delta > 0 ? 0 : ids.length - 1)
      : Math.max(0, Math.min(ids.length - 1, idx + delta));
    setFocus(ids[next]);
  }
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
    // 确认框/抽屉打开时不响应业务快捷键
    if (document.getElementById('confirmMask').style.display === 'flex') return;
    switch (e.key) {
      case 'j': e.preventDefault(); moveFocus(1); break;
      case 'k': e.preventDefault(); moveFocus(-1); break;
      case 'g': if (focusId != null) { e.preventDefault(); gen(focusId); } break;
      case 'c': if (focusId != null) { e.preventDefault(); copyGreet(focusId); } break;
      case 's': if (focusId != null) {
        e.preventDefault();
        const sel = document.querySelector(`.status-sel[data-id="${focusId}"]`);
        if (sel) { sel.value = 'CONTACTED'; changeStatus(focusId, 'CONTACTED'); }
      } break;
      case 'x': if (focusId != null) {
        e.preventDefault();
        const c = document.querySelector(`.job-sel[data-id="${focusId}"]`);
        if (c) { c.checked = !c.checked; syncSelection(); }
      } break;
      case '/': e.preventDefault(); document.getElementById('q').focus(); break;
      default: break;
    }
  });

  // ===== 投递记录抽屉 =====
  function openRecords() {
    document.getElementById('recordsMask').style.display = 'flex';
    loadRecords();
  }
  function closeRecords() {
    document.getElementById('recordsMask').style.display = 'none';
  }
  async function loadRecords() {
    const box = document.getElementById('recordsBox');
    box.textContent = '加载中…';
    try {
      const list = await api('/api/stats/recent');
      if (!list.length) { box.textContent = '暂无投递记录'; return; }
      box.innerHTML = list.map(r => `
        <div class="rec">
          <div><b>${esc(r.company)}</b> · ${esc(r.title || '')}
            <span class="tag" style="background:${r.success ? '#e8f3f0' : '#fdeeee'};color:${r.success ? '#1f6f63' : '#b33'}">${r.success ? '成功' : '失败'}</span>
          </div>
          <div class="meta">${esc(String(r.sentAt || '').replace('T', ' ').slice(0, 16))}${r.failReason ? ' · ' + esc(r.failReason) : ''}</div>
          ${r.message ? `<div class="msg">${esc(r.message)}</div>` : ''}
          <button onclick="deleteRecord(${r.id})">删除这条记录</button>
        </div>`).join('');
    } catch (e) { box.textContent = '读取失败：' + e.message; }
  }
  async function deleteRecord(id) {
    const ok = await confirmBox('删除投递记录', '确定删除这条投递记录吗？此操作不影响 AI 额度账本。');
    if (!ok) return;
    try {
      const res = await fetch(`/api/stats/recent/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.message || res.status);
      }
      toast('已删除');
      await loadRecords();
      await refreshStats();
    } catch (e) { toast('删除失败：' + e.message, 'err'); }
  }
  // ===== 表格尺寸可调：表头拖列宽、行底边拖行高，布局写入 localStorage =====
  const DEFAULT_COL_WIDTHS = [3, 11, 20, 10, 6, 6, 6, 6, 7, 6, 19];
  const COL_KEY = 'internHelper.table.colWidths';
  const ROW_KEY = 'internHelper.table.rowHeights';
  let rowDrag = null;

  function tableCols() {
    let cg = document.getElementById('tableCols');
    if (!cg) {
      cg = document.createElement('colgroup');
      cg.id = 'tableCols';
      const table = document.querySelector('table');
      table.insertBefore(cg, table.firstChild);
    }
    while (cg.children.length < DEFAULT_COL_WIDTHS.length) cg.appendChild(document.createElement('col'));
    return Array.from(cg.children);
  }

  function loadColWidths() {
    try {
      const saved = JSON.parse(localStorage.getItem(COL_KEY) || 'null');
      return Array.isArray(saved) && saved.length === DEFAULT_COL_WIDTHS.length
        && saved.every(n => Number(n) > 0) ? saved : DEFAULT_COL_WIDTHS;
    } catch (e) { return DEFAULT_COL_WIDTHS; }
  }

  function applyColWidths(widths) {
    tableCols().forEach((col, i) => { col.style.width = widths[i] + '%'; });
  }

  function saveColWidths() {
    const ths = Array.from(document.querySelectorAll('thead th'));
    const total = ths.reduce((sum, th) => sum + th.getBoundingClientRect().width, 0);
    if (!total) return;
    const pcts = ths.map(th => Number((th.getBoundingClientRect().width / total * 100).toFixed(2)));
    localStorage.setItem(COL_KEY, JSON.stringify(pcts));
  }

  function startColDrag(e, idx) {
    e.preventDefault();
    e.stopPropagation();
    const ths = Array.from(document.querySelectorAll('thead th'));
    const widths = ths.map(th => th.getBoundingClientRect().width);
    const neighbor = idx === widths.length - 2 ? idx - 1 : idx + 1;
    const pairSum = widths[idx] + widths[neighbor];
    const startX = e.clientX;
    const move = ev => {
      let w = widths[idx] + (ev.clientX - startX);
      w = Math.max(36, Math.min(pairSum - 36, w));
      const cols = tableCols();
      cols[idx].style.width = w + 'px';
      cols[neighbor].style.width = (pairSum - w) + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      saveColWidths();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function setupColResizers() {
    applyColWidths(loadColWidths());
    Array.from(document.querySelectorAll('thead th')).forEach((th, i, ths) => {
      if (i === ths.length - 1 || th.querySelector('.col-resizer')) return;
      const handle = document.createElement('div');
      handle.className = 'col-resizer';
      handle.title = '拖动调整列宽';
      handle.addEventListener('mousedown', e => startColDrag(e, i));
      th.appendChild(handle);
    });
  }

  function loadRowHeights() {
    try { return JSON.parse(localStorage.getItem(ROW_KEY) || '{}') || {}; } catch (e) { return {}; }
  }

  function applyRowHeights() {
    const map = loadRowHeights();
    document.querySelectorAll('tr[data-job-id]').forEach(tr => {
      const h = map[tr.dataset.jobId];
      tr.style.height = h ? Number(h) + 'px' : '';
    });
  }

  function saveRowHeight(id, height) {
    const map = loadRowHeights();
    if (height < 40) delete map[id]; else map[id] = Math.round(height);
    localStorage.setItem(ROW_KEY, JSON.stringify(map));
  }

  document.addEventListener('mousemove', e => {
    if (rowDrag) {
      e.preventDefault();
      rowDrag.tr.style.height = Math.max(36, rowDrag.h + e.clientY - rowDrag.startY) + 'px';
      return;
    }
    const tr = e.target && e.target.closest ? e.target.closest('tr[data-job-id]') : null;
    const tbody = document.getElementById('rows');
    if (!tr || !tbody) return;
    const rect = tr.getBoundingClientRect();
    tbody.style.cursor = (e.clientY >= rect.bottom - 5 && e.clientY <= rect.bottom + 2) ? 'row-resize' : '';
  });

  document.addEventListener('mousedown', e => {
    const tr = e.target && e.target.closest ? e.target.closest('tr[data-job-id]') : null;
    if (!tr) return;
    const rect = tr.getBoundingClientRect();
    if (e.clientY < rect.bottom - 5 || e.clientY > rect.bottom + 2) return;
    e.preventDefault();
    rowDrag = { tr: tr, id: tr.dataset.jobId, startY: e.clientY, h: rect.height };
    const up = () => {
      if (rowDrag) saveRowHeight(rowDrag.id, rowDrag.tr.getBoundingClientRect().height);
      rowDrag = null;
      document.removeEventListener('mouseup', up);
      const tbody = document.getElementById('rows');
      if (tbody) tbody.style.cursor = '';
    };
    document.addEventListener('mouseup', up);
  });

  function resetTableLayout() {
    localStorage.removeItem(COL_KEY);
    localStorage.removeItem(ROW_KEY);
    location.reload();
  }

  setupColResizers();

  document.addEventListener('DOMContentLoaded', function () {
    const mask = document.getElementById('recordsMask');
    mask.addEventListener('click', function (e) { if (e.target === mask) closeRecords(); });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      // 确认框优先响应
      const cm = document.getElementById('confirmMask');
      if (cm.style.display === 'flex') { closeConfirm(false); return; }
      if (mask.style.display === 'flex') closeRecords();
    });
  });

  (async function () {
    await initRegions();
    load(true);
  })();
</script>
</body>
</html>
